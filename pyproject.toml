[project]
name = "subtext"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=1.56.0",
    "openai>=2.14.0",
    "textual>=6.11.0",
    "tiktoken>=0.12.0",
    "yt-dlp>=2025.12.8",
]

[project.scripts]
subtext = "subtext.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtext"]
